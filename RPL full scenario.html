<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCTM+ Attack Scenarios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f5fb;--white:#fff;--border:#dde0f0;--text:#1a1d2e;--muted:#7880a0;--blue:#4f6ef7;--purple:#7c5cbf;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--grad:linear-gradient(135deg,#4f6ef7,#7c5cbf);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.hdr{background:var(--white);border-bottom:2px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px;}
.pill{background:var(--grad);color:#fff;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:20px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.hdr h1{font-size:.92rem;font-weight:800;}
.sel{display:flex;gap:6px;}
.abtn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:2px solid var(--border);background:var(--white);font-family:'Inter',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.abtn.bh{border-color:var(--red);background:#fee2e2;color:var(--red);}
.abtn.dis{border-color:var(--orange);background:#fff7ed;color:var(--orange);}
.dot{width:9px;height:9px;border-radius:50%;}
.sbadge{background:var(--bg);border:1.5px solid var(--border);color:var(--muted);font-size:.76rem;font-weight:600;padding:5px 12px;border-radius:20px;white-space:nowrap;}
.prog{height:4px;background:var(--border);flex-shrink:0;}
.pf{height:100%;transition:width .4s,background .4s;border-radius:2px;}
.layout{flex:1;display:grid;grid-template-columns:1fr 490px;overflow:hidden;min-height:0;}
.cw{padding:14px;overflow:hidden;min-height:0;}
canvas{width:100%;height:100%;display:block;}
.panel{background:var(--white);border-left:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.phdr{padding:12px 18px 9px;border-bottom:1.5px solid var(--border);flex-shrink:0;}
.plb{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;}
.ptt{font-size:1.15rem;font-weight:800;line-height:1.25;}
.info{flex:1;overflow-y:auto;padding:11px 16px;display:flex;flex-direction:column;gap:9px;min-height:0;}
.expl{border:1.5px solid;border-radius:11px;padding:11px 14px;font-size:.86rem;line-height:1.75;flex-shrink:0;}
.expl strong{font-weight:700;}
.card{background:var(--bg);border:1.5px solid var(--border);border-radius:11px;overflow:hidden;flex-shrink:0;}
.ch{padding:9px 15px;background:var(--white);border-bottom:1px solid var(--border);font-size:.83rem;font-weight:700;}
.cb{padding:11px 15px;}
.io{display:flex;gap:9px;margin-bottom:8px;align-items:flex-start;}
.io:last-child{margin-bottom:0;}
.il{font-size:.7rem;font-weight:700;color:var(--muted);min-width:62px;padding-top:2px;text-transform:uppercase;flex-shrink:0;}
.iv{font-size:.85rem;line-height:1.6;}
.cb2{background:var(--white);border:1.5px solid var(--border);border-radius:9px;overflow:hidden;margin-top:7px;}
.cl{display:grid;grid-template-columns:155px 18px 1fr;align-items:center;padding:7px 13px;border-bottom:1px solid var(--border);gap:5px;}
.cl:last-child{border-bottom:none;}
.cv{color:var(--purple);font-weight:700;font-size:.8rem;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.co{color:var(--muted);font-size:.8rem;font-family:'JetBrains Mono',monospace;text-align:center;}
.cr{color:var(--text);font-size:.78rem;font-family:'JetBrains Mono',monospace;}
.ew{display:flex;flex-direction:column;gap:6px;}
.es{background:var(--white);border:1.5px solid var(--border);border-radius:9px;overflow:hidden;}
.esh{padding:5px 13px;background:var(--bg);border-bottom:1px solid var(--border);font-size:.67rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.esl{padding:5px 13px;}
.el{display:flex;align-items:baseline;gap:7px;padding:6px 0;border-bottom:1px solid #f0f1f8;flex-wrap:wrap;}
.el:last-child{border-bottom:none;}
.ev{font-weight:700;font-size:.85rem;font-family:'JetBrains Mono',monospace;min-width:112px;flex-shrink:0;}
.ep{color:var(--muted);font-size:.81rem;font-family:'JetBrains Mono',monospace;}
.er{font-size:.79rem;font-family:'JetBrains Mono',monospace;}
.eres{font-weight:800;font-size:.89rem;font-family:'JetBrains Mono',monospace;}
.esub{color:var(--muted);font-size:.7rem;font-family:'JetBrains Mono',monospace;}
.tb{margin-top:9px;}
.tr{display:grid;grid-template-columns:95px 1fr 55px;align-items:center;gap:9px;margin-bottom:7px;}
.tr:last-child{margin-bottom:0;}
.tl{font-size:.82rem;font-weight:700;}
.bb{background:var(--border);border-radius:4px;height:9px;}
.bf{height:9px;border-radius:4px;transition:width .8s ease,background .8s;}
.tv{font-size:.82rem;font-weight:700;text-align:right;font-family:'JetBrains Mono',monospace;}
.badge{display:inline-block;padding:4px 12px;border-radius:7px;font-size:.83rem;font-weight:700;margin-top:6px;}
.bg{background:#dbeafe;color:#1d4ed8;} .bf2{background:#ffedd5;color:var(--orange);} .bd{background:#fee2e2;color:var(--red);}
.nb{border-radius:8px;padding:7px 11px;font-size:.81rem;font-weight:600;flex-shrink:0;}
.nav{padding:11px 16px;border-top:1.5px solid var(--border);display:flex;gap:7px;flex-shrink:0;}
.btn{flex:1;padding:10px;border:2px solid var(--border);background:var(--white);color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:700;border-radius:9px;cursor:pointer;transition:all .2s;}
.btn:hover{border-color:var(--blue);color:var(--blue);}
.btn.p{color:#fff;border:none;}
.btn.rp{background:#fff8ed;border:2px solid var(--orange);color:var(--orange);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;"><span class="pill">DCTM+</span><h1>DCTM-RPL — Attack Detection Scenarios</h1></div>
  <div class="sel">
    <button class="abtn bh" id="bBH" onclick="selAtk('bh')"><span class="dot" style="background:var(--red)"></span>⚫ Blackhole</button>
    <button class="abtn" id="bDIS" onclick="selAtk('dis')"><span class="dot" style="background:var(--orange)"></span>📡 DIS Flood</button>
  </div>
  <span class="sbadge" id="sb">Scene 1 / 10</span>
</div>
<div class="prog"><div class="pf" id="pf" style="width:10%;background:var(--grad)"></div></div>
<div class="layout">
  <div class="cw"><canvas id="cvs"></canvas></div>
  <div class="panel">
    <div class="phdr"><div class="plb" id="pl" style="color:var(--blue)">Scene 1</div><div class="ptt" id="pt">Building the Network</div></div>
    <div class="info" id="info"></div>
    <div class="nav">
      <button class="btn" id="bp" onclick="prev()" disabled>← Prev</button>
      <button class="btn rp" id="br" onclick="replay()" style="display:none">↺ Replay</button>
      <button class="btn p" id="bn" onclick="next()" style="background:var(--grad)">Next →</button>
    </div>
  </div>
</div>
<script>
const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
let W,H;
function rsz(){const w=cvs.parentElement;W=cvs.width=w.clientWidth-28;H=cvs.height=w.clientHeight-28;}
rsz();window.addEventListener('resize',()=>{rsz();bldN();drw();});

let mode='bh';
function selAtk(m){
  if(m===mode)return;mode=m;
  document.getElementById('bBH').className='abtn'+(m==='bh'?' bh':'');
  document.getElementById('bDIS').className='abtn'+(m==='dis'?' dis':'');
  document.getElementById('pf').style.background=m==='bh'?'var(--grad)':'linear-gradient(135deg,#ea580c,#c2410c)';
  curS=0;applyS(0);
}

const C={root:'#4f6ef7',normal:'#7c5cbf',new:'#ea580c',atk:'#dc2626',win:'#16a34a'};
let N={};
function bldN(){
  const cx=W/2,cy=H/2;
  N={root:{x:cx,y:cy-H*.36,lb:'Root',rk:0,col:C.root,r:42,v:false},
    n1:{x:cx-W*.30,y:cy-H*.12,lb:'Node 1',rk:1,col:C.normal,r:34,v:false},
    n2:{x:cx,y:cy-H*.12,lb:'Node 2',rk:1,col:C.normal,r:34,v:false},
    n3:{x:cx+W*.30,y:cy-H*.12,lb:'Node 3',rk:1,col:C.normal,r:34,v:false},
    n4:{x:cx-W*.36,y:cy+H*.10,lb:'Node 4',rk:2,col:C.normal,r:32,v:false},
    n5:{x:cx-W*.14,y:cy+H*.10,lb:'Node 5',rk:2,col:C.normal,r:32,v:false},
    n6:{x:cx+W*.10,y:cy+H*.10,lb:'Node 6',rk:2,col:C.normal,r:32,v:false},
    atk:{x:cx+W*.33,y:cy+H*.10,lb:'Attacker',rk:2,col:C.atk,r:34,v:false},
    n8:{x:cx-W*.28,y:cy+H*.32,lb:'Node 8',rk:3,col:C.normal,r:30,v:false},
    nw:{x:cx+W*.04,y:cy+H*.32,lb:'Node 10',rk:'?',col:C.new,r:36,v:false}};
}
bldN();
const LK=[['root','n1'],['root','n2'],['root','n3'],['n1','n4'],['n1','n5'],['n2','n6'],['n3','atk'],['n4','n8']];
let pkts=[],hl=[],wK=null,rK=[],dW=null,dWaves=[],rId=null,sIv=null;

function chnPkt(keys,col,lb,sp,cb){
  if(keys.length<2){if(cb)cb();return;}let s=0;
  function go(){if(s>=keys.length-1){if(cb)cb();return;}spPkt(keys[s],keys[s+1],col,s===0?lb:'',sp,()=>{s++;go();});gA();}go();
}
function spPkt(fk,tk,col,lb,sp,cb){pkts.push({fk,tk,col,lb:lb||'',p:0,sp:sp||.007,cb,_d:false});}
function gA(){if(!rId)rId=requestAnimationFrame(lp);}
function lp(){
  drw();let busy=false;
  pkts.forEach(p=>{if(p.p<1){p.p=Math.min(1,p.p+p.sp);busy=true;}else if(!p._d){p._d=true;if(p.cb)p.cb();}});
  pkts=pkts.filter(p=>p.p<1.05);
  dWaves=dWaves.map(w=>({...w,r:w.r+3.5,a:w.a-.04})).filter(w=>w.a>0);
  if(dWaves.length)busy=true;
  if(busy||pkts.length)rId=requestAnimationFrame(lp);else rId=null;
}
function drw(){
  ctx.clearRect(0,0,W,H);
  if(dW){ctx.beginPath();ctx.arc(dW.x,dW.y,dW.r,0,Math.PI*2);ctx.strokeStyle=dW.col+'44';ctx.lineWidth=3;ctx.stroke();}
  dWaves.forEach(w=>{ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);
    const col=w.col==='purple'?`rgba(124,92,191,${w.a})`:`rgba(234,88,12,${w.a})`;
    ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();});
  LK.forEach(([a,b])=>{const na=N[a],nb=N[b];if(!na||!nb||!na.v||!nb.v)return;ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb.x,nb.y);ctx.strokeStyle='#cdd0e8';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.stroke();ctx.setLineDash([]);});
  if(N.nw.v){['n5','n6','atk'].forEach(k=>{if(!N[k]||!N[k].v)return;const iw=wK===k;ctx.beginPath();ctx.moveTo(N.nw.x,N.nw.y);ctx.lineTo(N[k].x,N[k].y);ctx.strokeStyle=iw?C.win+'99':'#cdd0e8';ctx.lineWidth=iw?4:2;ctx.setLineDash(iw?[]:[6,5]);ctx.stroke();ctx.setLineDash([]);});}
  pkts.forEach(p=>{const fn=N[p.fk],tn=N[p.tk];if(!fn||!tn)return;const x=fn.x+(tn.x-fn.x)*p.p,y=fn.y+(tn.y-fn.y)*p.p;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();if(p.lb){ctx.font='bold 11px Inter';ctx.fillStyle=p.col;ctx.textAlign='center';ctx.fillText(p.lb,x,y-16);}});
  Object.entries(N).forEach(([k,n])=>{
    if(!n.v)return;const iH=hl.includes(k),iW=wK===k,iR=rK.includes(k);
    if(iH||iW){ctx.beginPath();ctx.arc(n.x,n.y,n.r+18,0,Math.PI*2);ctx.fillStyle=n.col+'13';ctx.fill();ctx.shadowColor=n.col+'44';ctx.shadowBlur=16;}
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=(iH||iW)?n.col:'#fff';ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=iR?C.atk:(iW?C.win:n.col);ctx.lineWidth=iH||iW||iR?3.5:2.5;ctx.stroke();
    ctx.font='bold 13px Inter';ctx.fillStyle=(iH||iW)?'#fff':n.col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.lb,n.x,n.y-7);
    ctx.font='700 10px JetBrains Mono';ctx.fillStyle=(iH||iW)?'#ffffffcc':'#8890a8';ctx.fillText('rank='+n.rk,n.x,n.y+9);
    if(iW){ctx.font='bold 11px Inter';ctx.fillStyle=C.win;ctx.fillText('✓ WINNER',n.x,n.y-n.r-16);}
    if(iR){ctx.font='bold 11px Inter';ctx.fillStyle=C.atk;ctx.fillText('✗ REJECTED',n.x,n.y-n.r-16);}
  });ctx.textBaseline='alphabetic';
}

// Math
const bel=(xs,xf)=>(xs+1)/(xs+xf+2);
const unc=(xs,xf)=>{const n=xs+xf;return n?Math.exp(-n*.15):.99;};
const qv=(xs,xf)=>Math.max(0,bel(xs,xf)*(1-unc(xs,xf)));
const tv=(xs,xf,q,c)=>(qv(xs,xf)+q+c)/3;
const cls=t=>{if(t>=.9)return'COMPLETE';if(t>=.7)return{l:'GOOD',c:'bg'};if(t>=.5)return{l:'FAIR',c:'bf2'};if(t>=.2)return{l:'POOR',c:'bf2'};return{l:'DISTRUST',c:'bd'};};
const bc=v=>v>=.7?'#16a34a':v>=.5?'#4f6ef7':v>=.2?'#ea580c':'#dc2626';

// HTML helpers
function xBH(h){return`<div class="expl" style="background:#fff5f5;border-color:#fca5a5;">${h}</div>`;}
function xDIS(h){return`<div class="expl" style="background:#fff7ed;border-color:#fed7aa;">${h}</div>`;}
function xE(h){return mode==='bh'?xBH(h):xDIS(h);}
function cds(ls){return`<div class="cb2">${ls.map(([v,o,r])=>`<div class="cl"><span class="cv">${v}</span><span class="co">${o}</span><span class="cr">${r}</span></div>`).join('')}</div>`;}

function eqBH(xs,xf,qos,ct){
  const b=bel(xs,xf),u=unc(xs,xf),q=qv(xs,xf),t=tv(xs,xf,qos,ct),cl=typeof cls(t)==='object'?cls(t):{l:'COMPLETE',c:'bg'};
  return`<div class="ew">
    <div class="es"><div class="esh">① QPC — Bayesian Belief (Eq.4,9) ← PRIMARY DETECTOR</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">x_success</span><span class="ep">=</span><span style="color:var(--green);font-weight:700">${xs}</span><span class="esub"> DAO-ACKs received</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">x_fail</span><span class="ep">=</span><span style="color:var(--red);font-weight:700">${xf}</span><span class="esub"> DAO-ACK timeouts ← Blackhole signature</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">Belief</span><span class="ep">=</span><span class="er">(${xs}+1)/(${xs}+${xf}+2)</span><span class="ep">=</span><span class="eres" style="color:${b>=.6?'var(--blue)':'var(--red)'}">${b.toFixed(3)}</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">Uncertainty</span><span class="ep">=</span><span class="er">e<sup>−H</sup></span><span class="ep">=</span><span class="eres" style="color:var(--blue)">${u.toFixed(3)}</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">T_QPC</span><span class="ep">=</span><span class="er">Belief×(1−Unc)</span><span class="ep">=</span><span class="eres" style="color:${q<.4?'var(--red)':'var(--blue)'}">${q.toFixed(3)}</span></div>
    </div></div>
    <div class="es"><div class="esh">② QoS — fixed per node (Eq.16,17)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">T_QoS</span><span class="ep">=</span><span class="eres" style="color:var(--blue)">${qos.toFixed(3)}</span><span class="esub"> ← stays high — Attacker has good signal</span></div>
    </div></div>
    <div class="es"><div class="esh">③ Context — fixed per node (Eq.18–20)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">T_CTX</span><span class="ep">=</span><span class="eres" style="color:var(--blue)">${ct.toFixed(3)}</span><span class="esub"> ← stays high — Attacker is stable</span></div>
    </div></div>
    <div class="es"><div class="esh">④ Final Trust (Eq.15)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">T_total</span><span class="ep">=</span><span class="er">(${q.toFixed(3)}+${qos.toFixed(3)}+${ct.toFixed(3)})/3</span><span class="ep">=</span><span class="eres" style="color:${t<.5?'var(--red)':'var(--blue)'}">${t.toFixed(3)}</span></div>
    </div></div>
  </div>
  <div class="tb">
    <div class="tr"><span class="tl">T_QPC</span><div class="bb"><div class="bf" style="width:${(q*100).toFixed(0)}%;background:${bc(q)}"></div></div><span class="tv" style="color:${bc(q)}">${q.toFixed(2)}</span></div>
    <div class="tr"><span class="tl">T_QoS</span><div class="bb"><div class="bf" style="width:${(qos*100).toFixed(0)}%;background:#4f6ef7"></div></div><span class="tv" style="color:#4f6ef7">${qos.toFixed(2)}</span></div>
    <div class="tr"><span class="tl">T_total</span><div class="bb"><div class="bf" style="width:${(t*100).toFixed(0)}%;background:${bc(t)}"></div></div><span class="tv" style="color:${bc(t)}">${t.toFixed(2)}</span></div>
  </div>
  <div class="badge ${cl.c}">${cl.l}</div>
  ${t<.2?'<div style="margin-top:7px;font-size:.84rem;font-weight:700;color:#dc2626;">⚠ parent_has_usable_link() → 0 — REJECTED</div>':''}`;
}

function eqDIS(rc,stab,nrg){
  const mob=Math.max(0,1-(rc/10));const ct=(mob+stab+nrg)/3;const qp=0.72,qs=0.78;const t=(qp+qs+ct)/3;const cl=typeof cls(t)==='object'?cls(t):{l:'COMPLETE',c:'bg'};
  return`<div class="ew">
    <div class="es"><div class="esh">① QPC — (Eq.4,9)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">T_QPC</span><span class="ep">=</span><span class="eres" style="color:var(--blue)">${qp.toFixed(3)}</span><span class="esub"> ← moderate — DIS flood doesn't drop data packets</span></div>
    </div></div>
    <div class="es"><div class="esh">② QoS — degrades under flooding (Eq.16,17)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">T_QoS</span><span class="ep">=</span><span class="eres" style="color:${bc(qs)}">${qs.toFixed(3)}</span><span class="esub"> ← ETX rises (channel congested by DIS)</span></div>
    </div></div>
    <div class="es"><div class="esh">③ Context — PRIMARY DETECTOR (Eq.18–20)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">rank_changes</span><span class="ep">=</span><span style="color:var(--red);font-weight:700">${rc}</span><span class="esub"> ← DODAG rebuilding constantly!</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">N-Mobility</span><span class="ep">=</span><span class="er">1−(${rc}/10)</span><span class="ep">=</span><span class="eres" style="color:${bc(mob)}">${mob.toFixed(3)}</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">N-Stability</span><span class="ep">=</span><span class="eres" style="color:${bc(stab)}">${stab.toFixed(3)}</span><span class="esub"> ← ETX variance rising</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">N-Energy</span><span class="ep">=</span><span class="eres" style="color:${bc(nrg)}">${nrg.toFixed(3)}</span><span class="esub"> ← battery draining fast</span></div>
      <div class="el"><span class="ev" style="color:var(--purple)">T_CTX</span><span class="ep">=</span><span class="er">(${mob.toFixed(3)}+${stab.toFixed(3)}+${nrg.toFixed(3)})/3</span><span class="ep">=</span><span class="eres" style="color:${bc(ct)}">${ct.toFixed(3)}</span></div>
    </div></div>
    <div class="es"><div class="esh">④ Final Trust (Eq.15)</div><div class="esl">
      <div class="el"><span class="ev" style="color:var(--purple)">T_total</span><span class="ep">=</span><span class="er">(${qp.toFixed(3)}+${qs.toFixed(3)}+${ct.toFixed(3)})/3</span><span class="ep">=</span><span class="eres" style="color:${t<.5?'var(--red)':'var(--blue)'}">${t.toFixed(3)}</span></div>
    </div></div>
  </div>

        +`<div class="card"><div class="ch">DIS Flood vs DCTM — Which Dimension Fires?</div><div class="cb">
          <div class="io"><span class="il" style="color:var(--green)">T_QPC</span><span class="iv">0.720 — data forwarded normally → <strong>deceived ✓</strong></span></div>
          <div class="io"><span class="il" style="color:var(--orange)">T_QoS</span><span class="iv">0.780 — ETX rises slightly (channel congested by DIS)</span></div>
          <div class="io"><span class="il" style="color:var(--red)">T_CTX</span><span class="iv">rank_changes=9, N-Stab=0.22, N-Energy=0.18 → <strong style="color:var(--red)">CAUGHT ✗</strong></span></div>
        </div></div>
        <div class="card"><div class="ch">parent_has_usable_link() — rpl-dctm.c</div><div class="cb">
          ${cds([
            ['T_total','=','(0.720 + 0.780 + 0.187) / 3 = 0.562  → wait...'],
            ['T_CTX','=','0.187  → below threshold 0.2'],
            ['parent_has_usable_link','(','attacker ) → returns 0'],
            ['rpl_select_parent','(','dag ) → skips attacker'],
          ])}
        </div></div>`;}
    },
    // DIS S5 — isolated + summary
    {lb:'Scene 5 / 5',pr:100,pl:'Scene 5 — DIS Flood',pt:'Attacker Isolated — Detection Summary',hr:false,
      enter(){hl=[];wK=null;rK=['atk'];dW=null;dWaves=[];Object.values(N).forEach(n=>n.v=true);N.nw.v=false;drw();},
      render(){return xDIS(`Attacker <strong style="color:var(--red)">isolated</strong>. DODAG stabilizes. Legitimate nodes maintain healthy CTX and are preferred as parents.`)
        +`<div class="card"><div class="ch">DIS Flood — Detection Summary</div><div class="cb">
          <div class="io"><span class="il" style="color:var(--orange)">Attack</span><span class="iv">dis_output(NULL) every 500ms → rpl_reset_dio_timer() on all neighbors</span></div>
          <div class="io"><span class="il" style="color:var(--orange)">Signature</span><span class="iv">rank_changes=9 | N-Stability=0.22 | N-Energy=0.18 | T_CTX → 0.187</span></div>
          <div class="io"><span class="il" style="color:var(--green)">Detector</span><span class="iv"><strong>T_CTX only</strong> — QPC was unaffected (data still forwarded)</span></div>
          <div class="io"><span class="il" style="color:var(--green)">Result</span><span class="iv">parent_has_usable_link() = 0 → Attacker rejected ✓</span></div>
        </div></div>
        <div class="card" style="border-color:#c5caf5;background:#eef0fd"><div class="ch" style="background:#eef0fd;color:var(--blue)">Key Difference — Blackhole vs DIS Flood</div><div class="cb">
          <div class="io"><span class="il" style="color:var(--red)">Blackhole</span><span class="iv">Drops data → <strong>T_QPC collapses</strong> — x_fail accumulates</span></div>
          <div class="io"><span class="il" style="color:var(--orange)">DIS Flood</span><span class="iv">Floods control plane → <strong>T_CTX collapses</strong> — rank unstable</span></div>
          <div class="io"><span class="il" style="color:var(--green)">Proof</span><span class="iv">Same DCTM framework — different dimension activates per attack ✓</span></div>
        </div></div>`;}
    },
  ];

  // DIS mode shows only DIS scenes (5 scenes), BH shows all 10
  if(mode==='dis') return dis;
  return [...shared,...bh];
}

let SCENES=[];
function applyS(i){
  clearInterval(sIv);cancelAnimationFrame(rId);rId=null;pkts=[];dWaves=[];xs=0;xf=0;rc=0;
  SCENES=mkScenes();const sc=SCENES[i];
  document.getElementById('sb').textContent=sc.lb;
  document.getElementById('pf').style.width=sc.pr+'%';
  document.getElementById('pl').textContent=sc.pl;
  document.getElementById('pl').style.color=mode==='bh'?'var(--red)':'var(--orange)';
  document.getElementById('pt').textContent=sc.pt;
  document.getElementById('bp').disabled=i===0;
  document.getElementById('bn').disabled=i===SCENES.length-1;
  document.getElementById('bn').textContent=i===SCENES.length-1?'Done ✓':'Next →';
  document.getElementById('bn').style.background=mode==='bh'?'var(--grad)':'linear-gradient(135deg,#ea580c,#c2410c)';
  document.getElementById('br').style.display=sc.hr?'block':'none';
  eFn=sc.enter.bind(sc);sc.enter();
  document.getElementById('info').innerHTML=sc.render();
  drw();
}
function next(){if(curS<SCENES.length-1){curS++;applyS(curS);}}
function prev(){if(curS>0){curS--;applyS(curS);}}
window.addEventListener('load',()=>{bldN();applyS(0);});
</script>
